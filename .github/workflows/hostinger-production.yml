name: Build Hostinger Production

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production
        run: npm run build

      - name: Add SPA routing for Hostinger
        shell: bash
        run: |
          cat > dist/.htaccess <<'EOF'
          Options -MultiViews
          RewriteEngine On
          RewriteBase /
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          RewriteRule ^ index.html [L]
          EOF

      - name: Publish generated site to hostinger-production
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin refs/heads/hostinger-production:refs/remotes/origin/hostinger-production
          publish_dir="${RUNNER_TEMP}/gleemour-hostinger-production"
          git worktree add -b hostinger-production "$publish_dir" origin/hostinger-production
          git -C "$publish_dir" rm -qr -- .
          cp -a dist/. "$publish_dir/"
          cd "$publish_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --allow-empty -m "deploy: ${GITHUB_SHA}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin hostinger-production
